name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (must match v*, for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          }
          require_secret KEYSTORE_BASE64 "$KEYSTORE_BASE64"
          require_secret STORE_PASSWORD "$STORE_PASSWORD"
          require_secret KEY_PASSWORD "$KEY_PASSWORD"
          require_secret KEY_ALIAS "$KEY_ALIAS"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions repository secrets: ${missing[*]}. Add KEYSTORE_BASE64 (base64 of the upload .jks), STORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS (set to upload) under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release tag. Push a tag matching v* or run this workflow manually and set the tag input (for example v1.0.0)."
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "::error::Release tag must match v* (got: ${tag})."
              exit 1
              ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9._-]*)
              echo "::error::Release tag may contain only letters, numbers, dots, underscores, and hyphens (got: ${tag})."
              exit 1
              ;;
          esac
          version_name="${tag#v}"
          if [ -z "$version_name" ]; then
            echo "::error::Release tag must include a version after the leading v (got: ${tag})."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36.1 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore_file="${RUNNER_TEMP}/upload-keystore.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_file"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. On macOS, copy the keystore with: base64 -i ~/keys/iota-upload.jks | pbcopy"
            exit 1
          fi
          if [ ! -s "$keystore_file" ]; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file. Paste the base64 text of the .jks with no extra wrapping."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore_file" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" >/dev/null; then
            echo "::error::Could not open the decoded keystore with KEY_ALIAS and STORE_PASSWORD. KEY_ALIAS must be the keystore alias (upload), and STORE_PASSWORD must be the keystore password."
            exit 1
          fi
          echo "KEYSTORE_PATH=${keystore_file}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name the release APK
        id: apk
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK under app/build/outputs/apk/release, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          dest="iota-vehicle-tracker-${RELEASE_TAG}.apk"
          cp -- "${apks[0]}" "$dest"
          echo "path=${dest}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
